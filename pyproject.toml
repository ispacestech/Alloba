[project]
name = "alloba"
version = "0.3.0"
description = "Alloba gateway — agentic sourcing, ethical AI compliance knowledge engine, ispaces Commerce platform proxy, and the Alloba Training immersive micro-training/certification engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "langchain-ollama>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-core>=0.3.0",
    "faiss-cpu>=1.8.0",
    "ollama>=0.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
rag = [
    "pypdf>=4.0.0",
]

[project.scripts]
alloba = "alloba.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alloba = ["data/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["B008", "B904", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.vercel]
entrypoint = "src.alloba.main:app"
Learn More: https://vercel.com/docs/frameworks/backend/fastapi#exporting-the-fastapi-application
